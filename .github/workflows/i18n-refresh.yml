name: Likes i18n update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          tools: wp-cli
          coverage: none

      - name: Install gettext
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gettext

      - name: Update canonical translation catalogs
        run: tools/i18n/update

      - name: Verify canonical translation catalogs
        run: tools/i18n/check

      - name: Validate generated diff
        run: git diff --check

      - name: Commit generated catalogs
        shell: bash
        run: |
          git add languages/
          if git diff --cached --quiet; then
            echo 'Translation catalogs are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Likes translations [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
