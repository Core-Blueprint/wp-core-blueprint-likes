name: Temporary PHP 8.4 minimum update

on:
  push:
    branches:
      - fix/likes-php84-minimum
    paths:
      - .github/workflows/tmp-php84-minimum.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gettext and polib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext
          python3 -m pip install --disable-pip-version-check polib
      - name: Align Likes to PHP 8.4 minimum
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import polib

          main = Path('core-blueprint-likes.php')
          text = main.read_text()
          replacements = {
              'Requires PHP:      8.0': 'Requires PHP:      8.4',
              "version_compare( PHP_VERSION, '8.0', '<' )": "version_compare( PHP_VERSION, '8.4', '<' )",
              'requires PHP 8.0 or higher. This server runs PHP %s.': 'requires PHP 8.4 or higher. This server runs PHP %s.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one Likes match for: {old}')
              text = text.replace(old, new, 1)
          main.write_text(text)

          old_msgid = 'requires PHP 8.0 or higher. This server runs PHP %s.'
          new_msgid = 'requires PHP 8.4 or higher. This server runs PHP %s.'

          pot = Path('languages/core-blueprint-likes.pot')
          pot_text = pot.read_text()
          if pot_text.count(old_msgid) != 1:
              raise SystemExit('Expected exactly one Likes POT msgid')
          pot.write_text(pot_text.replace(old_msgid, new_msgid, 1))

          po_paths = sorted(Path('languages').glob('core-blueprint-likes-*.po'))
          if len(po_paths) != 6:
              raise SystemExit(f'Expected 6 Likes PO catalogs, found {len(po_paths)}')
          for path in po_paths:
              po = polib.pofile(str(path))
              entry = po.find(old_msgid)
              if entry is None:
                  raise SystemExit(f'Expected Likes msgid not found in {path}')
              entry.msgid = new_msgid
              if entry.msgstr:
                  entry.msgstr = entry.msgstr.replace('8.0', '8.4')
              po.save(str(path))
              po.save_as_mofile(str(path.with_suffix('.mo')))
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l core-blueprint-likes.php
          grep -q 'Requires PHP:      8.4' core-blueprint-likes.php
          grep -q "version_compare( PHP_VERSION, '8.4', '<' )" core-blueprint-likes.php
          ! grep -q 'requires PHP 8.0 or higher' core-blueprint-likes.php
          for po in languages/core-blueprint-likes-*.po; do
            msgfmt --check --check-format -o /dev/null "$po"
          done
          ! grep -R -F 'requires PHP 8.0 or higher. This server runs PHP %s.' languages --include='*.po' --include='*.pot'
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Core Blueprint CI'
          git config user.email 'actions@users.noreply.github.com'
          git add core-blueprint-likes.php languages
          git diff --cached --check
          git commit -m 'Require PHP 8.4 for Core Blueprint Likes'
          git push origin HEAD:fix/likes-php84-minimum
